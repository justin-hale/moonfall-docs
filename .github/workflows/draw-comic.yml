name: Draw Comic

# Turns a scene from a session into a comic page (scripts/comic_scene.py) and
# opens it as a PR, so nothing reaches the site until someone has looked at
# it and merged. Merging publishes through deploy.yml like any other edit.
#
# Run from main to start a new comic: it opens a "Comic: ..." PR. To fix one,
# edit data/comics/<slug>/script.json on that PR's branch, then run this
# again choosing the PR branch under "Use workflow from" with mode "redraw"
# (or "letter-only" for text-only changes, which costs nothing). Runs on a
# branch other than main commit back to that branch instead of opening a PR.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Session number (e.g. 64), or character names for portraits mode'
        required: true
      mode:
        description: 'new = script + art + lettering; redraw = art from the edited script; letter-only = text only (no API); portraits = character reference art'
        required: true
        default: 'new'
        type: choice
        options:
          - 'new'
          - 'redraw'
          - 'letter-only'
          - 'portraits'
      scene:
        description: 'new: recap ### heading to draw (blank = let Claude pick)'
        required: false
        default: ''
      panel:
        description: 'redraw: only this panel number (blank = all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: draw-comic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3-pro-image-preview' }}
      TARGET: ${{ github.event.inputs.target }}
      MODE: ${{ github.event.inputs.mode }}
      SCENE: ${{ github.event.inputs.scene }}
      PANEL: ${{ github.event.inputs.panel }}

    steps:
      # A PAT, not GITHUB_TOKEN, so the push and PR trigger Stats & Build Check.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.OMELAS_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic google-genai pillow pydantic

      - name: Check the Gemini key
        if: env.MODE != 'letter-only'
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add a GEMINI_API_KEY repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Draw
        run: |
          set -o pipefail
          case "$MODE" in
            portraits)   read -ra names <<< "$TARGET"; args=(--portraits "${names[@]}") ;;
            new)         args=("$TARGET"); [ -n "$SCENE" ] && args+=(--scene "$SCENE") ;;
            redraw)      args=("$TARGET" --redraw); [ -n "$PANEL" ] && args+=(--panel "$PANEL") ;;
            letter-only) args=("$TARGET" --letter-only) ;;
          esac
          python scripts/comic_scene.py "${args[@]}" | tee "$RUNNER_TEMP/comic-log.txt"

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.OMELAS_PAT || github.token }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          if [ "$MODE" = "portraits" ]; then
            message="Draw reference portraits: $TARGET"
          else
            message="Comic for session $TARGET ($MODE)"
          fi
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            git commit -m "$message"
            git push
            exit 0
          fi
          branch="comic/$(echo "$TARGET" | tr -cs 'A-Za-z0-9' '-' | sed 's/-$//')-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "$message"
          git push -u origin "$branch"
          {
            echo "Generated by the Draw Comic workflow (\`$MODE\`). Look at the page before merging: merging publishes it."
            echo
            echo "To fix it, edit \`data/comics/<slug>/script.json\` on this branch and re-run Draw Comic from this branch with mode \`redraw\` (art) or \`letter-only\` (text)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/comic-log.txt"
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$branch" --title "$message" --body-file "$RUNNER_TEMP/pr-body.md"
