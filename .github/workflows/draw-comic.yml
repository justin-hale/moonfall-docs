name: Draw Comic

# Draws comic strips (scripts/comic_scene.py). Usual flow: the strip's
# data/comics/<name>/script.json is written by hand (or with Claude in a
# chat) and committed to a branch; then this workflow is run FROM THAT BRANCH
# ("Use workflow from") with mode "draw", which draws the panels, letters
# the strip, embeds it in the recap and commits the result back to the
# branch. Runs from main open their own PR instead. Nothing reaches the site
# until the PR is merged.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'draw = art + lettering from script.json · letter = re-letter only, free · portraits = character reference art · auto = Claude also writes the script'
        required: true
        default: 'draw'
        type: choice
        options:
          - 'draw'
          - 'letter'
          - 'portraits'
          - 'auto'
      comic:
        description: 'draw / letter: the comic folder under data/comics, e.g. session-64-silas-and-the-first-angel'
        required: false
        default: ''
      panel:
        description: 'draw: redraw only this panel number (blank = all panels)'
        required: false
        default: ''
      characters:
        description: 'portraits: character names separated by spaces, e.g. Ohma Bru'
        required: false
        default: ''
      session:
        description: 'auto: session number, e.g. 64'
        required: false
        default: ''
      scene:
        description: 'auto: the recap ### heading to draw (blank = Claude picks)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: draw-comic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3-pro-image-preview' }}
      # Per-run ceiling on image requests (retries count). See scripts/README.md → Gemini key and budget.
      COMIC_MAX_IMAGES: ${{ vars.COMIC_MAX_IMAGES || '10' }}
      MODE: ${{ github.event.inputs.mode }}
      COMIC: ${{ github.event.inputs.comic }}
      PANEL: ${{ github.event.inputs.panel }}
      CHARACTERS: ${{ github.event.inputs.characters }}
      SESSION: ${{ github.event.inputs.session }}
      SCENE: ${{ github.event.inputs.scene }}

    steps:
      # The built-in GITHUB_TOKEN pushes the branch and opens the PR, as Process
      # Episode does; OMELAS_PAT cannot write to this repo (run #1 got a 403).
      # A PR opened by GITHUB_TOKEN does not start Stats & Build Check on its
      # own; the build still runs on merge (deploy.yml).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic google-genai pillow pydantic

      - name: Check the Gemini key
        if: env.MODE != 'letter'
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::No GEMINI_API_KEY secret. Setup steps: scripts/README.md, section 'Gemini key and budget'."
            exit 1
          fi

      - name: Draw
        id: draw
        run: |
          set -o pipefail
          need() { [ -n "$2" ] || { echo "::error::Mode '$MODE' needs the '$1' input."; exit 1; }; }
          case "$MODE" in
            draw)      need comic "$COMIC"; args=(--comic "$COMIC" --draw)
                       [ -n "$PANEL" ] && args+=(--panel "$PANEL") ;;
            letter)    need comic "$COMIC"; args=(--comic "$COMIC" --letter-only) ;;
            portraits) need characters "$CHARACTERS"; read -ra names <<< "$CHARACTERS"
                       args=(--portraits "${names[@]}") ;;
            auto)      need session "$SESSION"; args=("$SESSION")
                       [ -n "$SCENE" ] && args+=(--scene "$SCENE") ;;
          esac
          python scripts/comic_scene.py "${args[@]}" | tee "$RUNNER_TEMP/comic-log.txt"

      # Also after a failed Draw: a run stopped by COMIC_MAX_IMAGES has already
      # paid for the panels it drew, so they are kept (the job still goes red).
      - name: Commit and open PR
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          case "$MODE" in
            portraits) label="$CHARACTERS"; message="Draw reference portraits: $CHARACTERS" ;;
            auto)      label="session-$SESSION"; message="Comic for session $SESSION (auto)" ;;
            *)         label="$COMIC"; message="Comic $COMIC ($MODE)" ;;
          esac
          if [ "${{ steps.draw.outcome }}" != "success" ]; then
            message="Incomplete: $message"
          fi
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            git commit -m "$message"
            git push
            exit 0
          fi
          branch="comic/$(echo "$label" | tr -cs 'A-Za-z0-9' '-' | sed 's/-$//')-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "$message"
          git push -u origin "$branch"
          {
            echo "Generated by the Draw Comic workflow (\`$MODE\`). Look at the page before merging: merging publishes it."
            echo
            echo "To fix it, edit \`data/comics/<name>/script.json\` on this branch and re-run Draw Comic from this branch with mode \`draw\` (art; set \`panel\` to redraw just one) or \`letter\` (text only, free)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/comic-log.txt"
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$branch" --title "$message" --body-file "$RUNNER_TEMP/pr-body.md"
