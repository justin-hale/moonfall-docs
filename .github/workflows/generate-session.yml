name: Generate Session Notes

on:
  push:
    branches:
      - main
    paths:
      - "transcripts_raw/*.srt"
  workflow_dispatch:
    inputs:
      session_number:
        description: "Session number (leave empty for auto-detect)"
        required: false
        type: string
      interlude:
        description: "Create an interlude instead of a regular session"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
      session_title: ${{ steps.commit.outputs.session_title }}
      session_slug: ${{ steps.commit.outputs.session_slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      # Claude API auth: workload identity federation is the primary path —
      # a short-lived GitHub OIDC token is exchanged for Claude API access,
      # no static key stored. Until federation is configured (or if it needs
      # to be rolled back), ANTHROPIC_FALLBACK_API_KEY keeps the pipeline
      # working. See .github/workload-identity-setup.md
      - name: Select Claude API auth mode
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          FALLBACK_KEY_SET: ${{ secrets.ANTHROPIC_FALLBACK_API_KEY != '' }}
        run: |
          if [ -n "$FEDERATION_RULE_ID" ] && [ -n "$ORGANIZATION_ID" ] && [ -n "$SERVICE_ACCOUNT_ID" ]; then
            echo "Auth mode: workload identity federation"
            echo "CLAUDE_AUTH_MODE=federation" >> "$GITHUB_ENV"
          elif [ "$FALLBACK_KEY_SET" = "true" ]; then
            echo "::warning::Workload identity federation not configured — using ANTHROPIC_FALLBACK_API_KEY. See .github/workload-identity-setup.md to finish the migration."
            echo "CLAUDE_AUTH_MODE=api-key" >> "$GITHUB_ENV"
          else
            echo "::error::No Claude API auth configured. Either set the ANTHROPIC_FEDERATION_RULE_ID / ANTHROPIC_ORGANIZATION_ID / ANTHROPIC_SERVICE_ACCOUNT_ID repository variables (workload identity federation), or set the ANTHROPIC_FALLBACK_API_KEY secret. See .github/workload-identity-setup.md"
            exit 1
          fi

      - name: Fetch GitHub OIDC token
        if: env.CLAUDE_AUTH_MODE == 'federation'
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/claude-oidc-token"

      - name: Generate session notes
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/claude-oidc-token
          ANTHROPIC_FALLBACK_API_KEY: ${{ secrets.ANTHROPIC_FALLBACK_API_KEY }}
        run: |
          # An API key takes precedence over federation in the SDK, so expose
          # exactly one auth mechanism to the script.
          if [ "$CLAUDE_AUTH_MODE" = "api-key" ]; then
            export ANTHROPIC_API_KEY="$ANTHROPIC_FALLBACK_API_KEY"
            unset ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID \
              ANTHROPIC_SERVICE_ACCOUNT_ID ANTHROPIC_IDENTITY_TOKEN_FILE
          fi
          unset ANTHROPIC_FALLBACK_API_KEY
          ARGS=""
          if [ -n "${{ inputs.session_number }}" ]; then
            ARGS="$ARGS --session-number ${{ inputs.session_number }}"
          fi
          if [ "${{ inputs.interlude }}" = "true" ]; then
            ARGS="$ARGS --interlude"
          fi
          python scripts/automate_session.py $ARGS

      - name: Commit generated files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/sessions/ docs/transcripts/ transcripts_raw/ data/campaign-state.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            # Extract the new session filename and title before committing
            NEW_FILE=$(git diff --cached --name-only | grep -E '^docs/sessions/(session|interlude)-[0-9]+\.md$' | head -1)
            if [ -n "$NEW_FILE" ]; then
              TITLE=$(grep -m1 '^title:' "$NEW_FILE" | sed 's/^title: *"*//;s/"*$//')
              SLUG=$(basename "$NEW_FILE" .md)
              echo "session_title=$TITLE" >> "$GITHUB_OUTPUT"
              echo "session_slug=$SLUG" >> "$GITHUB_OUTPUT"
            fi
            git commit -m "Generate session notes [automated]"
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: [generate-and-deploy, deploy]
    if: needs.generate-and-deploy.outputs.has_changes == 'true' && needs.generate-and-deploy.outputs.session_slug != ''
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TITLE="${{ needs.generate-and-deploy.outputs.session_title }}"
          SLUG="${{ needs.generate-and-deploy.outputs.session_slug }}"
          URL="https://moonfallsessions.com/sessions/$SLUG"
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"New session posted: **$TITLE** - $URL\"}" \
            "$DISCORD_WEBHOOK_URL"
