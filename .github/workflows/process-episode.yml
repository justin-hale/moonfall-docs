name: Process Episode

on:
  schedule:
    # Saturday 10:00 EDT (14:00 UTC)
    - cron: '0 14 * * 6'
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Override: Google Drive file ID (skip auto-detect)'
        required: false
        default: ''
      episode_number:
        description: 'Override: episode number (skip auto-detect)'
        required: false
        default: ''
      session_date:
        description: 'Override: session date YYYY-MM-DD (skip filename parse)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — log what would happen without executing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DRIVE_FILE_ID: ${{ github.event.inputs.drive_file_id || '' }}
      EPISODE_NUMBER: ${{ github.event.inputs.episode_number || '' }}
      SESSION_DATE: ${{ github.event.inputs.session_date || '' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID || '14EVI64FlpZCwRy4UL4ZhGjlsjK55XL1h' }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      OMELAS_PAT: ${{ secrets.OMELAS_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install google-api-python-client google-auth

      # Was FedericoCarboni/setup-ffmpeg@v3, which downloads a build from an
      # external host. On 2026-08-22 that download failed with
      # `TypeError: fetch failed` ten seconds into the weekly run — before
      # `Detect episode` ever ran, so Episode 60 was never pulled from Drive,
      # never transcribed, and never opened its SRT PR. Everything downstream
      # sat idle and nothing said why. Ubuntu's own package removes the
      # third-party action and the external host along with it.
      - name: Setup ffmpeg
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "ffmpeg already present on the runner image."
          else
            for attempt in 1 2 3; do
              if sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; then
                break
              fi
              echo "apt attempt $attempt failed; retrying" >&2
              sleep $((attempt * 5))
            done
          fi
          # ci_process.py extract encodes MP3 with libmp3lame. Fail here rather
          # than an hour in, after the video has already been downloaded.
          ffmpeg -hide_banner -encoders | grep -q libmp3lame
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Create workspace directory
        run: mkdir -p workspace

      # ── Auto-detect: find newest Drive file with no matching release ──
      - name: Detect episode
        id: detect
        env:
          GH_TOKEN: ${{ secrets.OMELAS_PAT }}
        run: python scripts/ci_process.py detect

      # ── Exit early if nothing new or dry run ──
      - name: Check for skip
        if: env.SKIP == 'true'
        run: |
          echo "No new episodes found. Exiting."
          exit 0

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: |
          echo "=== DRY RUN ==="
          echo "EPISODE_NUMBER : $EPISODE_NUMBER"
          echo "DRIVE_FILE_ID  : $DRIVE_FILE_ID"
          echo "SESSION_DATE   : $SESSION_DATE"
          echo "Would download, extract, release, update-feed, open-pr"
          echo "Exiting (dry run)."
          exit 0

      # ── Download ──
      - name: Download video from Drive
        if: env.SKIP != 'true' && env.DRY_RUN != 'true'
        run: python scripts/ci_process.py download

      # ── Extract ──
      - name: Extract MP3 + SRT
        if: env.SKIP != 'true' && env.DRY_RUN != 'true'
        run: python scripts/ci_process.py extract

      # ── Free disk space ──
      - name: Delete source video
        if: env.SKIP != 'true' && env.DRY_RUN != 'true'
        run: rm -f workspace/source_video.*

      # ── GitHub release ──
      # Runs even when the release already exists. It used to be gated on
      # RELEASE_EXISTS != 'true', which skipped the one step that resolves the
      # episode's audio URL, so the next step died on `KeyError: 'audio_url'`
      # (run 32806651268) — the exact state every partial failure leaves behind.
      # ci_process.py release detects the existing release itself, reuses its
      # URL, and only sets RELEASE_CREATED_THIS_RUN when it really created one.
      - name: Create or resolve GitHub release
        if: env.SKIP != 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.OMELAS_PAT }}
        run: python scripts/ci_process.py release

      # ── RSS feed ──
      - name: Update RSS feed
        if: env.SKIP != 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.OMELAS_PAT }}
        run: python scripts/ci_process.py update-feed

      # ── moonfall-docs PR ──
      - name: Open notes PR on moonfall-docs
        if: env.SKIP != 'true' && env.DRY_RUN != 'true'
        # GH CLI requires GH_TOKEN to be set; give it the built-in token.  this
        # can be overridden by supplying a different secret in GH_TOKEN if you
        # really have a PAT that works here (see script comments/retry logic).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci_process.py open-pr

      # ── Cleanup on failure ──
      - name: Delete release if pipeline failed
        # only delete a release we created in this run. ci_process.py release
        # sets RELEASE_CREATED_THIS_RUN on that path alone, so a release left by
        # an earlier run survives this one's failure and stays reusable.
        if: failure() && env.SKIP != 'true' && env.DRY_RUN != 'true' && env.RELEASE_CREATED_THIS_RUN == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMELAS_PAT }}
        run: python scripts/ci_process.py delete-release

      # ── Save registry (runs even on partial failure) ──
      # This is the pipeline's memory of what it has already done, so losing it
      # costs a whole re-run: a plain `git push` here was rejected when a PR
      # merged mid-job (run 32578519926), discarding all five of episode 60's
      # stage records even though the release, the feed entry and the notes PR
      # had all succeeded. Rebase onto whatever landed and try again.
      - name: Commit episode registry
        if: always() && env.SKIP != 'true' && env.DRY_RUN != 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # make sure we're back on the default branch; the open-pr step switches
          # to an srt/* branch which then caused future pushes to fail with a
          # missing upstream.  checking out main avoids that.
          git checkout main || true
          git add data/episodes.json
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
            exit 0
          fi
          git commit -m "Update episode registry [automated]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Registry push rejected (attempt $attempt); rebasing onto origin/main." >&2
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Could not rebase data/episodes.json onto origin/main — the registry is now out of date. Re-run this workflow once main is settled."
              exit 1
            fi
          done
          echo "::error::Could not push data/episodes.json after 3 attempts."
          exit 1

      # ── Report a failure ──
      # Nothing used to announce a broken intake. The 2026-08-22 run died 24
      # seconds in and sat unnoticed until Monday, which is what turned a
      # four-minute failure into a missed week of publishing. Reuses the
      # Discord webhook that generate-session.yml already posts to.
      - name: Report failure to Discord
        if: failure() && env.DRY_RUN != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL configured; skipping failure notice."
            exit 0
          fi
          EPISODE="${EPISODE_NUMBER:-unknown}"
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"Process Episode failed for episode $EPISODE — no notes PR was opened. $RUN_URL\"}" \
            "$DISCORD_WEBHOOK_URL" || echo "Failure notice could not be delivered."

      - name: Summary
        if: env.SKIP != 'true' && env.DRY_RUN != 'true'
        run: |
          echo "=== Pipeline complete ==="
          echo "Episode  : $EPISODE_NUMBER"
          echo "Date     : $SESSION_DATE"
          echo "Release  : https://github.com/topherhooper/omelas-stories/releases/tag/v$EPISODE_NUMBER"
          echo ""
          echo "Next step: Merge the SRT PR on justin-hale/moonfall-docs to trigger notes generation."
          echo "After merge: python aftershow.py generate $EPISODE_NUMBER --date $SESSION_DATE"
