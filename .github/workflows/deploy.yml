name: Deploy to GitHub Pages

on:
  # Any push to main publishes. Until now this was workflow_dispatch only, so
  # the only content that reached the site automatically was a new session —
  # Generate Session Notes builds and deploys its own commit. Everything else
  # (a /fix-notes correction, a hand edit, a new NPC or location page) sat on
  # main unpublished until someone remembered to dispatch this by hand. The
  # Session 59 corrections in #35 reached readers only because someone did.
  #
  # This does not double-deploy the automated session commit: that push is made
  # with GITHUB_TOKEN, and GitHub does not start new workflow runs from events
  # its own token triggers.
  #
  # Deliberately unfiltered by path. A paths: list would be cheaper, but
  # forgetting an entry there reintroduces exactly the silent
  # never-publishes bug this is fixing; a redundant three-minute build is the
  # better failure.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Hosted GitHub runners have 7 GB of RAM available, let's use 6 GB
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Build the tip of main, not the commit that triggered this run.
      #
      # Runs queue on the shared "pages" concurrency group below, so by the
      # time one reaches a runner main has often moved on — and publishing the
      # older tree silently un-publishes whatever landed in between, with both
      # runs green and nothing to show it happened.
      #
      # Episode 60 is what that looks like. The SRT merge (aa1a2bd) triggered
      # this workflow and Generate Session Notes at the same instant. Generate
      # wrote the recap, committed it as a424205, built, and deployed by
      # 04:20:10. This run, queued behind it, started 3 seconds later, checked
      # out aa1a2bd — the commit from before the recap existed — and deployed
      # that at 04:23:26. Session 60 came off the live site, and the Discord
      # announcement pointed at a 404.
      #
      # Pinned to main rather than github.ref: the live site is built from main
      # only, so a dispatch from a topic branch must not publish it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4